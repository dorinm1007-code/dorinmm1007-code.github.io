/* Manual enterprise block-diagram builder */
.mb-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 265px;gap:14px;align-items:start}

.mb-node rect{fill:var(--panel);stroke:var(--line)}.mb-type-grid rect{fill:color-mix(in srgb,#8269ff 12%,var(--panel));stroke:#8269ff}

.mb-type-motor rect{fill:color-mix(in srgb,#ff7185 10%,var(--panel));stroke:#e75c72}.mb-type-load rect{fill:color-mix(in srgb,#9b8cff 10%,var(--panel));stroke:#8f7ee8}

.mb-props .field{margin-bottom:9px}.mb-mode{color:var(--accent);font-weight:800}.mb-help{font-size:11px;color:var(--muted);margin-top:9px}

/* ===== Single-line electrical diagram editor ===== */
.sl-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 285px;gap:14px;align-items:start}
.sl-palette{position:sticky;top:104px}.sl-palette-list{display:grid;gap:7px}
.sl-tool{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:750}
.sl-tool:hover{border-color:var(--accent);transform:translateY(-1px)}
.sl-tool .ico{width:36px;height:36px;min-width:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--accent)}
.sl-tool .ico svg{width:30px;height:30px;display:block;overflow:visible}.sl-tool .ico *{vector-effect:non-scaling-stroke}
.sl-canvas-card{padding:10px;min-width:0}.sl-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.sl-workspace{height:700px;border:1px solid var(--line);border-radius:13px;overflow:auto;background:var(--bg2);position:relative}
.sl-workspace svg{height:680px;display:block;touch-action:none;user-select:none}
.sl-node{cursor:grab}.sl-node:active{cursor:grabbing}.sl-node .hit{fill:transparent;stroke:transparent}
.sl-node .sym{stroke:var(--text);stroke-width:2.2;fill:none;vector-effect:non-scaling-stroke}
.sl-node .symfill{stroke:var(--text);stroke-width:2;fill:var(--panel);vector-effect:non-scaling-stroke}
.sl-node .ref{fill:var(--accent);font:800 12px ui-monospace,Consolas,monospace;pointer-events:none}
.sl-node .rating{fill:var(--text);font:750 11px Arial,sans-serif;pointer-events:none}
.sl-node .sub{fill:var(--muted);font:10px Arial,sans-serif;pointer-events:none}
.sl-node .selectbox{stroke:transparent;fill:none}.sl-node.selected .selectbox{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:5 4}
.sl-link{stroke:var(--text);stroke-width:2.3;fill:none;vector-effect:non-scaling-stroke;cursor:pointer}
.sl-link.selected{stroke:var(--warn);stroke-width:4}.sl-link-dot{fill:var(--text)}
.sl-mode{font-weight:850;color:var(--accent)}.sl-props .field{margin-bottom:9px}.sl-props .grid2{gap:8px}
.sl-help{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.45}
.sl-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--muted);font-size:10px}
.sl-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.sl-legend span{font-size:10px;color:var(--muted)}
@media(max-width:1200px){.sl-layout{grid-template-columns:170px minmax(0,1fr)}.sl-props{grid-column:1/-1}.sl-palette{position:static}}
@media(max-width:760px){.sl-layout{grid-template-columns:1fr}.sl-palette-list{grid-template-columns:repeat(2,1fr)}.sl-workspace{height:580px}}

/* ===== Help center and first-run guide ===== */
.help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">⚡</div><div><h1>ElectroEngineer Studio</h1><p data-i18n="tagline">Предварительное проектирование электроснабжения 0,4 кВ</p><div class="creator">Dorin Monolatii · <b>F.E.I.E. U.T.M.</b></div></div></div>

</main>
</div>
<div class="footer">ElectroEngineer Studio · Dorin Monolatii · F.E.I.E. U.T.M. · <span data-i18n="eduOnly">Учебный предварительный расчёт</span></div>
</div>
<script>
const SQRT3=Math.sqrt(3);
const $=id=>document.getElementById(id);
const fmt=(x,n=2)=>Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:n,minimumFractionDigits:n}):'—';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const standardSizes=[1.5,2.5,4,6,10,16,25,35,50,70,95,120,150,185,240,300,400,500];
const breakers=[6,10,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500];
const icuLevels=[6,10,15,25,36,50,70,100,150];

function val(x,d=0){x=parseFloat(x);return Number.isFinite(x)?x:d}
function nextStd(arr,x){return arr.find(v=>v>=x)??arr[arr.length-1]}

function faultCurrent(R,X){return state.lv/(SQRT3*Math.max(1e-9,Math.hypot(R,X)))}

 const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','1200');clone.setAttribute('height','720');
 const style=document.createElementNS('http://www.w3.org/2000/svg','style');
 style.textContent=`svg{--line:#d7e1ec;--accent:#176fd1;--text:#142033;--muted:#617289;--panel:#ffffff}.mb-node rect{fill:#ffffff;stroke:#45566d;stroke-width:2}.mb-title{fill:#142033;font:700 13px Arial}.mb-sub{fill:#617289;font:10px Arial}.mb-icon{font:18px Arial}.mb-link{stroke:#176fd1;stroke-width:2.5;fill:none}`;
 clone.insertBefore(style,clone.firstChild);
 const data=new XMLSerializer().serializeToString(clone),blob=new Blob([data],{type:'image/svg+xml;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=(state.projectName||'enterprise-diagram').replace(/[^\w\-]+/g,'_')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
document.addEventListener('keydown',e=>{
 if(!$('manual')?.classList.contains('active'))return;
 if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();mbRemove()}
 if(e.key==='Escape'&&mbConnectMode){mbToggleConnect()}
});
Object.assign(window,{mbAdd,mbRemove,mbClear,mbToggleConnect,mbUpdateSelected,mbSetSnap,mbAutoTemplate,mbExportSVG});

function ht(k){return HELP_I18N[lang]?.[k]||HELP_I18N.ru[k]||k}

 const pg=$('help');if(!pg)return;
 pg.innerHTML=`<div class="page-head"><div><h2>${ht('title')}</h2><p>${ht('sub')}</p></div>
 <div style="display:flex;gap:7px;flex-wrap:wrap"><button class="primary tiny" onclick="showGuide()">▶ ${ht('showGuide')}</button><button class="secondary tiny" onclick="enableStartupGuide()">↻ ${ht('showStartup')}</button></div></div>
 <div class="help-grid">
  <div class="help-card"><h3>${ht('start')}</h3><div class="help-steps">
   ${helpStep(1,ht('step1t'),ht('step1'))}${helpStep(2,ht('step2t'),ht('step2'))}${helpStep(3,ht('step3t'),ht('step3'))}${helpStep(4,ht('step4t'),ht('step4'))}${helpStep(5,ht('step5t'),ht('step5'))}

  </div>
  <div class="help-card"><h3>${ht('diagram')}</h3><p>${ht('diagramText')}</p><h3 style="margin-top:16px">${ht('hotkeys')}</h3>
   <p><span class="help-kbd">Delete</span> ${ht('deleteKey').replace(/^Delete\s*[—-]\s*/,'')}</p><p><span class="help-kbd">Esc</span> ${ht('escapeKey').replace(/^Esc\s*[—-]\s*/,'')}</p><p>${ht('drag')}</p>
  </div>
  <div class="help-card"><h3>${ht('save')}</h3><p>${ht('saveText')}</p><div class="help-warning" style="margin-top:14px"><b>${ht('limits')}</b><br>${ht('limitsText')}</div></div>
 </div>`;

function helpStep(n,title,text){return `<div class="help-step"><div class="help-num">${n}</div><div><b>${title}</b><p>${text}</p></div></div>`}

 return `<div class="guide-overlay" id="userGuideOverlay" role="dialog" aria-modal="true">
  <div class="guide-modal">
   <div class="guide-head"><div><h2>${ht('welcome')}</h2><p>${ht('welcomeSub')}</p></div><button class="guide-close" onclick="closeGuide()" aria-label="Close">×</button></div>
   <div class="guide-body"><div class="guide-list">
    ${guideItem('01',ht('step1t'),ht('step1'))}${guideItem('02',ht('step2t'),ht('step2'))}${guideItem('03',ht('step3t'),ht('step3'))}${guideItem('04',ht('step4t'),ht('step4'))}${guideItem('05',ht('step5t'),ht('step5'))}
    <div class="guide-item"><strong>QF · W · KM · FR · M · T</strong><p>${ht('sldText')}</p></div>

function guideItem(no,title,text){return `<div class="guide-item"><strong><span style="color:var(--accent)">${no}</span> · ${title}</strong><p>${text}</p></div>`}
function showGuide(){
 const old=$('userGuideOverlay');if(old)old.remove();
 document.body.insertAdjacentHTML('beforeend',guideMarkup());
}
function closeGuide(){
 const o=$('userGuideOverlay');if(!o)return;
 if($('guideDontShow')?.checked)localStorage.setItem('EE_HIDE_GUIDE','1');
 o.remove();
}
function guideGo(page){closeGuide();go(page)}
function enableStartupGuide(){localStorage.removeItem('EE_HIDE_GUIDE');alert(ht('startupEnabled'))}
Object.assign(window,{showGuide,closeGuide,guideGo,enableStartupGuide});

function renderReport(){C=calc();$('report').innerHTML=pageHead('reportTitle','reportSub',`<button class="primary no-print" onclick="window.print()">🖨 ${t('printPdf')}</button>`)+`<article class="report" id="reportDoc"><div class="split"><div><h2>ElectroEngineer — ${esc(state.projectName)}</h2><div class="hint">Dorin Monolatii · F.E.I.E. U.T.M.</div></div><div class="code-pill">${new Date().toLocaleDateString(lang==='ro'?'ro-RO':lang==='en'?'en-GB':'ru-RU')}</div></div><p>${t('reportIntro')}</p><div class="report-section"><h3>${t('calcResults')}</h3><div class="kpis">${kpi('P',fmt(C.P,2)+' kW','')}${kpi('Q',fmt(C.Q,2)+' kvar','')}${kpi('S',fmt(C.S,2)+' kVA','')}${kpi('I',fmt(C.I,2)+' A','')}${kpi('Qc',fmt(C.Qc,2)+' kvar','')}${kpi('cosφ',fmt(C.pf,3),'')}</div></div><div class="report-section"><h3>${t('transformers')}</h3><p>${t('recommended')}: <b>${C.recommended} kVA</b>. ${t('loadPct')}: <b>${fmt(C.loadPct,1)}%</b>. ${t('n1')}: <b>${t(C.S1?(C.n1ok?'n1Ok':'n1Bad'):'noCat1')}</b>.</p></div><div class="report-section"><h3>${t('loadsCard')}</h3><table class="report-table"><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>P</th><th>Q</th><th>I</th><th>${t('cat')}</th></tr></thead><tbody>${C.loads.map(x=>`<tr><td>${esc(x.name)}</td><td>${t(x.type)}</td><td>${fmt(x.P,2)} kW</td><td>${fmt(x.Q,2)} kvar</td><td>${fmt(x.I,1)} A</td><td>${x.cat}</td></tr>`).join('')}</tbody></table></div><div class="report-section"><h3>${t('protectionTitle')}</h3><p>${t('busFault')}: <b>${fmt(C.IkBus/1000,2)} kA</b>. ${t('grshFault')}: <b>${fmt(C.grsh.Ik/1000,2)} kA</b>.</p><p>${t('mainCable')}: <b>${C.main?`${C.main.runs}×${C.main.size} mm² ${state.material}`:'—'}</b>; ${t('breaker')}: <b>${C.main?C.main.br:'—'} A / Icu ${C.mainIcu} kA</b>; ${t('drop')}: <b>${C.main?fmt(C.main.dUpct,2):'—'}%</b>.</p></div><div class="report-section"><h3>${t('earthResult')}</h3><p><b>${fmt(C.Rg,2)} Ω</b> / ${t('targetWord')} ${state.ground.target} Ω. SPD: ${C.spd}.</p></div><div class="report-section"><h3>${t('economyTitle')}</h3><p>${t('energy')}: <b>${fmt(C.energy,0)} kWh/y</b>; ${t('energyCost')}: <b>${fmt(C.cost,0)} MDL/y</b>; ${t('lossSaving')}: <b>${fmt(C.lossSaving,0)} MDL/y</b>.</p></div><div class="report-section"><h3>${t('singleLine')}</h3><div class="diagram" id="reportDiagram"></div></div><div class="note"><strong>!</strong> ${t('eduWarning')}</div></article>`;setTimeout(()=>renderDiagram('reportDiagram'),0)}
function renderDiagram(target='diagram'){const e=$(target);if(!e)return;C=calc();const tr=state.transformers.map(x=>`${esc(x.name)} ${x.kva} kVA · Uk ${x.uk}%`).join(' + ');const mc=C.main?`${C.main.runs}×${C.main.size} mm²`:'—';e.innerHTML=`<svg viewBox="0 0 1180 310"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker></defs><g fill="none" class="d-line" marker-end="url(#arr)"><path d="M140 130H235"/><path d="M390 130H480"/><path d="M640 130H735"/><path d="M900 130H995"/></g>${dbox(20,85,120,90,'MV',state.hv+' kV')}${dbox(235,80,155,100,'MV switchgear',fmt(C.IkBus/1000,1)+' kA LV equiv.')}${dbox(480,65,160,130,'Transformer',tr+' · Uk')}${dbox(735,75,165,110,'Main cable',mc+' · ΔU '+(C.main?fmt(C.main.dUpct,2):'—')+'%')}${dbox(995,75,160,110,'MDB',fmt(C.grsh.Ik/1000,1)+' kA')}<line x1="1075" y1="185" x2="1075" y2="255" class="d-bus"/>${dbox(280,235,150,65,'Cat. I',fmt(C.S1,1)+' kVA')}${dbox(515,235,150,65,'Motors',state.loads.filter(x=>x.type==='motor').length+' circuits')}${dbox(750,235,150,65,'Other loads',Math.max(0,state.loads.length-state.loads.filter(x=>x.type==='motor').length)+' circuits')}<path d="M1075 255H900" class="d-line" fill="none"/><path d="M1075 255H665" class="d-line" fill="none"/><path d="M1075 255H430" class="d-line" fill="none"/></svg>`}
function dbox(x,y,w,h,a,b){return `<rect class="d-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/><text class="d-title" x="${x+w/2}" y="${y+34}" text-anchor="middle">${a}</text><text class="d-sub" x="${x+w/2}" y="${y+58}" text-anchor="middle">${b}</text>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){nav();renderOverview();renderProject();renderLoads();renderProtection();renderSingleLine();renderGround();renderEconomy();renderManual();renderHelp();if($('report').classList.contains('active'))renderReport();applyStaticI18n();}
function applyStaticI18n(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').value=lang;document.documentElement.lang=lang}
function syncFromInputs(){const map=['projectName','hv','lv','ks','targetPf','sourceSk','mainLength','maxDrop','faultTime','material','insulation','derating','hours','price'];for(const id of map){const e=$(id);if(!e)continue;state[id]=['projectName','material','insulation'].includes(id)?e.value:val(e.value,state[id]);}const gm={gRho:'rho',gRods:'rods',gLen:'len',gEff:'eff',gTarget:'target',gLps:'lps',gEntry:'entry'};for(const [id,k] of Object.entries(gm)){const e=$(id);if(e)state.ground[k]=['lps','entry'].includes(k)?e.value:val(e.value,state.ground[k]);}const em={capPrice:'capPrice',trafoCost:'trafoCost',cableCost:'cableCost',switchCost:'switchCost',installCost:'installCost'};for(const [id,k] of Object.entries(em)){const e=$(id);if(e)state.econ[k]=val(e.value,state.econ[k]);}}
function refresh(){syncFromInputs();const active=document.querySelector('.page.active')?.id||'overview';render();go(active,false)}
function setTrafo(i,k,v){state.transformers[i][k]=k==='name'?v:val(v);refresh()}function addTrafo(){state.transformers.push({name:'T'+(state.transformers.length+1),kva:630,uk:6});refresh()}function delTrafo(i){if(state.transformers.length>1)state.transformers.splice(i,1);refresh()}
function setLoad(i,k,v){state.loads[i][k]=['name','type','cat'].includes(k)?v:val(v);refresh()}function addLoad(){state.loads.push({name:'Load '+(state.loads.length+1),type:'other',qty:1,kw:5,eta:1,pf:.9,ku:1,cat:'III',len:30,startK:1});refresh()}function delLoad(i){state.loads.splice(i,1);refresh()}function clearLoads(){if(confirm(t('confirmClear'))){state.loads=[];refresh()}}function demo(){state.loads=[{name:'Конвейер M1',type:'motor',qty:1,kw:15,eta:.91,pf:.84,ku:1,cat:'I',len:45,startK:6},{name:'Насосы',type:'motor',qty:2,kw:7.5,eta:.9,pf:.82,ku:.8,cat:'II',len:60,startK:6},{name:'Освещение',type:'lighting',qty:1,kw:12,eta:1,pf:.95,ku:.9,cat:'III',len:70,startK:1}];refresh()}
function saveProject(){syncFromInputs();localStorage.setItem('EE_STUDIO_V4',JSON.stringify(state));alert(t('saved'))}function loadProject(){const x=localStorage.getItem('EE_STUDIO_V4');if(!x)return alert(t('noSaved'));try{state=JSON.parse(x);refresh();alert(t('loaded'))}catch(e){alert(t('noSaved'))}}
Object.assign(window,{setTrafo,addTrafo,delTrafo,setLoad,addLoad,delLoad,clearLoads,demo,saveProject,loadProject});
document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;localStorage.setItem('EE_LANG',lang);render();return}if(e.target.closest('.page')&&!e.target.classList.contains('cell-input'))refresh()});
document.addEventListener('input',e=>{if(e.target.closest('.page')&&!e.target.classList.contains('cell-input')){clearTimeout(window.__eeTimer);window.__eeTimer=setTimeout(refresh,250)}});
$('themeBtn').onclick=()=>{const now=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=now;localStorage.setItem('EE_THEME',now)};document.documentElement.dataset.theme=localStorage.getItem('EE_THEME')||'dark';
render();
setTimeout(()=>{if(localStorage.getItem('EE_HIDE_GUIDE')!=='1')showGuide()},180);
