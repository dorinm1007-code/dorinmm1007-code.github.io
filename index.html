<head>

<title>ElectroEngineer Studio V10.0 — Dorin Monolatii</title>
<style>
:root{
 --bg:#07101e;--bg2:#0b1628;--panel:#101d31;--panel2:#14243c;--soft:#192b46;
 --text:#edf4ff;--muted:#8fa3bf;--line:#263b59;--accent:#55a8ff;--accent2:#62d6b4;
 --good:#45d39b;--warn:#ffca63;--bad:#ff7185;--shadow:0 18px 50px rgba(0,0,0,.23);
 --radius:16px;--input:#0a1729;
}
html[data-theme="light"]{
 --bg:#eef4fa;--bg2:#f8fbfe;--panel:#ffffff;--panel2:#f4f8fc;--soft:#eaf2f9;
 --text:#142033;--muted:#617289;--line:#d7e1ec;--accent:#176fd1;--accent2:#087f68;
 --good:#087f5b;--warn:#9b6500;--bad:#b4233b;--shadow:0 16px 45px rgba(44,68,96,.11);--input:#fff;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% -10%,rgba(85,168,255,.16),transparent 34%),linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);font:14px/1.48 Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}.app{max-width:1520px;margin:auto;padding:18px}.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 18px;margin-bottom:16px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7f7cff);color:#06101e;font-size:24px;font-weight:900;box-shadow:0 8px 22px rgba(85,168,255,.25)}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.creator{font-size:11px;color:var(--muted);margin-top:3px}.creator b{color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.mini-select,.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px}.icon-btn{cursor:pointer;min-width:40px}.primary{background:linear-gradient(135deg,var(--accent),#7b8cff);color:#06101e;border:0;font-weight:800;padding:10px 14px;border-radius:10px;cursor:pointer}.secondary,.danger{border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:700;padding:9px 12px;border-radius:10px;cursor:pointer}.danger{color:#fff;background:#a83248;border-color:#a83248}.tiny{padding:6px 9px;font-size:12px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px}.sidebar{position:sticky;top:102px;align-self:start;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:10px;box-shadow:var(--shadow)}.navbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:700}.navbtn:hover{background:var(--panel2);color:var(--text)}.navbtn.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent),transparent);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.nav-icon{width:24px;text-align:center}.side-note{border-top:1px solid var(--line);margin-top:10px;padding:12px 10px;color:var(--muted);font-size:11px}
.content{min-width:0}.page{display:none}.page.active{display:block}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 2px 14px}.page-head h2{font-size:24px;margin:0}.page-head p{color:var(--muted);margin:4px 0 0}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.badge.good{color:var(--good)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.card{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 95%,var(--bg)));border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.card h3{margin:0 0 12px;font-size:16px}.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field label{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;font-weight:700;margin:0 0 5px}.field input,.field select,.cell-input{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);padding:9px 10px;border-radius:9px;outline:none}.field input:focus,.field select:focus,.cell-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}.hint{font-size:10px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.kpi{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}.kpi .label{color:var(--muted);font-size:11px;font-weight:800}.kpi .value{font-size:22px;font-weight:900;margin:3px 0}.kpi .sub{font-size:10px;color:var(--muted)}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.health-item{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:11px 12px}.health-item .row{display:flex;justify-content:space-between;gap:8px}.health-item b{font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:820px;background:var(--panel)}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;z-index:1}td{font-size:12px}.status-good{color:var(--good);font-weight:800}.status-warn{color:var(--warn);font-weight:800}.status-bad{color:var(--bad);font-weight:800}
.formula{font-family:Cambria Math,Times New Roman,serif;font-size:15px;padding:11px 12px;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;margin:8px 0}.note{padding:11px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 8%,var(--panel2));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--muted)}.note strong{color:var(--warn)}.good-note{background:color-mix(in srgb,var(--good) 8%,var(--panel2));border-color:color-mix(in srgb,var(--good) 35%,var(--line))}.good-note strong{color:var(--good)}
.diagram{overflow:auto;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:12px}.diagram svg{min-width:980px;width:100%;height:310px}.d-box{fill:var(--panel);stroke:var(--line)}.d-title{fill:var(--text);font-weight:800}.d-sub{fill:var(--muted);font-size:11px}.d-line{stroke:var(--accent);stroke-width:3}.d-bus{stroke:var(--accent2);stroke-width:5}.d-warn{fill:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:var(--muted)}.divider{height:1px;background:var(--line);margin:14px 0}.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.code-pill{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:var(--soft);border:1px solid var(--line);padding:4px 7px;border-radius:7px}
.report{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.report h2{margin-top:0}.report-section{margin:20px 0}.report-table{min-width:0}.report-table th{position:static}.footer{color:var(--muted);font-size:11px;text-align:center;padding:18px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px}.navbtn{width:auto;white-space:nowrap}.side-note{display:none}.grid2,.grid3{grid-template-columns:1fr}.topbar{position:static}.page-head{align-items:flex-start;flex-direction:column}}
@media(max-width:600px){.app{padding:8px}.topbar{border-radius:12px;padding:12px}.brand p,.creator{display:none}.brand h1{font-size:18px}.logo{width:40px;height:40px}.top-actions .text-btn{display:none}.card{padding:12px;border-radius:12px}.page-head h2{font-size:20px}}
@media print{body{background:#fff;color:#111}.app{max-width:none;padding:0}.topbar,.sidebar,.no-print,.footer{display:none!important}.layout{display:block}.page{display:none!important}.page#report{display:block!important}.card,.report{box-shadow:none;background:#fff;border:0;color:#111}.report{padding:0}.report table{background:#fff;color:#111}.report th{background:#eee;color:#333}.report td,.report th{border-color:#bbb}.note{color:#333;background:#faf5e7}.diagram{background:#fff}.d-box{fill:#fff;stroke:#555}.d-title{fill:#111}.d-sub{fill:#444}}

/* Manual enterprise block-diagram builder */
.mb-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 265px;gap:14px;align-items:start}
.mb-palette{position:sticky;top:104px}.mb-palette-list{display:grid;gap:7px}
.mb-tool{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:700}
.mb-tool:hover{border-color:var(--accent);transform:translateY(-1px)}.mb-tool .ico{width:24px;text-align:center;font-size:17px}
.mb-canvas-card{padding:10px}.mb-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.mb-workspace{height:650px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--bg2);position:relative}
.mb-workspace svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.mb-node{cursor:grab}.mb-node:active{cursor:grabbing}.mb-node rect{stroke-width:2;filter:drop-shadow(0 5px 9px rgba(0,0,0,.16))}
.mb-node .mb-title{fill:var(--text);font-weight:800;font-size:13px;pointer-events:none}.mb-node .mb-sub{fill:var(--muted);font-size:10px;pointer-events:none}.mb-node .mb-icon{font-size:18px;pointer-events:none}
.mb-node.selected rect{stroke:var(--accent)!important;stroke-width:3}.mb-link{stroke:var(--accent);stroke-width:2.5;fill:none;cursor:pointer}.mb-link.selected{stroke:var(--warn);stroke-width:4}
.mb-node rect{fill:var(--panel);stroke:var(--line)}.mb-type-grid rect{fill:color-mix(in srgb,#8269ff 12%,var(--panel));stroke:#8269ff}
.mb-type-mv rect{fill:color-mix(in srgb,#ffca63 10%,var(--panel));stroke:#d6a336}.mb-type-trafo rect{fill:color-mix(in srgb,#55a8ff 12%,var(--panel));stroke:#55a8ff}
.mb-type-mdb rect{fill:color-mix(in srgb,#62d6b4 11%,var(--panel));stroke:#40b995}.mb-type-panel rect{fill:color-mix(in srgb,#5ab7c8 10%,var(--panel));stroke:#5ab7c8}
.mb-type-ats rect{fill:color-mix(in srgb,#ff9f5a 12%,var(--panel));stroke:#ff9f5a}.mb-type-gen rect{fill:color-mix(in srgb,#79cf68 10%,var(--panel));stroke:#79cf68}
.mb-type-motor rect{fill:color-mix(in srgb,#ff7185 10%,var(--panel));stroke:#e75c72}.mb-type-load rect{fill:color-mix(in srgb,#9b8cff 10%,var(--panel));stroke:#8f7ee8}
.mb-type-building rect{fill:color-mix(in srgb,#aab6c6 10%,var(--panel));stroke:#8998aa}.mb-type-bus rect{fill:color-mix(in srgb,var(--accent2) 9%,var(--panel));stroke:var(--accent2)}
.mb-props .field{margin-bottom:9px}.mb-mode{color:var(--accent);font-weight:800}.mb-help{font-size:11px;color:var(--muted);margin-top:9px}
.mb-badge{display:inline-flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--muted);font-size:10px}
@media(max-width:1150px){.mb-layout{grid-template-columns:170px minmax(0,1fr)}.mb-props{grid-column:1/-1}.mb-palette{position:static}}
@media(max-width:760px){.mb-layout{grid-template-columns:1fr}.mb-palette-list{grid-template-columns:repeat(2,1fr)}.mb-workspace{height:560px}}
@media print{#manual{display:none!important}}














/* ===== Single-line electrical diagram editor ===== */
.sl-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 285px;gap:14px;align-items:start}
.sl-palette{position:sticky;top:104px}.sl-palette-list{display:grid;gap:7px}
.sl-tool{width:100%;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:750}
.sl-tool:hover{border-color:var(--accent);transform:translateY(-1px)}
.sl-tool .ico{width:36px;height:36px;min-width:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--accent)}
.sl-tool .ico svg{width:30px;height:30px;display:block;overflow:visible}.sl-tool .ico *{vector-effect:non-scaling-stroke}
.sl-canvas-card{padding:10px;min-width:0}.sl-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.sl-workspace{height:700px;border:1px solid var(--line);border-radius:13px;overflow:auto;background:var(--bg2);position:relative}
.sl-workspace svg{height:680px;display:block;touch-action:none;user-select:none}
.sl-node{cursor:grab}.sl-node:active{cursor:grabbing}.sl-node .hit{fill:transparent;stroke:transparent}
.sl-node .sym{stroke:var(--text);stroke-width:2.2;fill:none;vector-effect:non-scaling-stroke}
.sl-node .symfill{stroke:var(--text);stroke-width:2;fill:var(--panel);vector-effect:non-scaling-stroke}
.sl-node .ref{fill:var(--accent);font:800 12px ui-monospace,Consolas,monospace;pointer-events:none}
.sl-node .rating{fill:var(--text);font:750 11px Arial,sans-serif;pointer-events:none}
.sl-node .sub{fill:var(--muted);font:10px Arial,sans-serif;pointer-events:none}
.sl-node .selectbox{stroke:transparent;fill:none}.sl-node.selected .selectbox{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:5 4}
.sl-link{stroke:var(--text);stroke-width:2.3;fill:none;vector-effect:non-scaling-stroke;cursor:pointer}
.sl-link.selected{stroke:var(--warn);stroke-width:4}.sl-link-dot{fill:var(--text)}
.sl-mode{font-weight:850;color:var(--accent)}.sl-props .field{margin-bottom:9px}.sl-props .grid2{gap:8px}
.sl-help{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.45}
.sl-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--muted);font-size:10px}
.sl-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.sl-legend span{font-size:10px;color:var(--muted)}
@media(max-width:1200px){.sl-layout{grid-template-columns:170px minmax(0,1fr)}.sl-props{grid-column:1/-1}.sl-palette{position:static}}
@media(max-width:760px){.sl-layout{grid-template-columns:1fr}.sl-palette-list{grid-template-columns:repeat(2,1fr)}.sl-workspace{height:580px}}
@media print{#singleline{display:none!important}}


/* ===== Help center and first-run guide ===== */
.help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.help-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:17px}
.help-card h3{margin:0 0 8px}.help-card p{color:var(--muted);line-height:1.55;margin:6px 0}
.help-steps{display:grid;gap:10px}.help-step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.help-num{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));display:grid;place-items:center;font-weight:900;color:var(--accent)}
.help-kbd{font:700 11px ui-monospace,Consolas,monospace;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel2)}
.help-symbols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin-top:9px}
.help-symbols div{font-size:12px;color:var(--muted)}.help-symbols b{color:var(--text)}
.guide-overlay{position:fixed;inset:0;z-index:100000;background:rgba(5,12,22,.72);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px}
.guide-modal{width:min(820px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.42)}
.guide-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:22px 24px 15px;border-bottom:1px solid var(--line)}
.guide-head h2{margin:0;font-size:23px}.guide-head p{margin:7px 0 0;color:var(--muted);line-height:1.45}
.guide-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer}
.guide-body{padding:19px 24px}.guide-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.guide-item{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--panel2)}
.guide-item strong{display:block;margin-bottom:5px}.guide-item p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.guide-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 24px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.guide-check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.guide-actions{display:flex;gap:8px;flex-wrap:wrap}
.help-warning{border-left:4px solid var(--warn);padding:11px 13px;background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:8px;color:var(--muted);line-height:1.45}
@media(max-width:800px){.help-grid,.guide-list{grid-template-columns:1fr}.help-symbols{grid-template-columns:1fr}}
@media print{#help,.guide-overlay{display:none!important}}


/* ===== V7 project engineering ===== */
.v7-toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.v7-icon{min-width:36px;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:900}
.v7-icon:hover{border-color:var(--accent);color:var(--accent)}.v7-icon:disabled{opacity:.35;cursor:not-allowed}
.v7-save-state{font-size:10px;color:var(--muted);padding:0 4px}
.v7-score{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--good) calc(var(--score)*1%),var(--soft) 0);position:relative}
.v7-score:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.v7-score b,.v7-score span{position:relative;z-index:1}.v7-score b{font-size:26px}.v7-score span{font-size:9px;color:var(--muted);display:block;text-align:center;margin-top:-5px}
.val-summary{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.val-counts{display:flex;gap:8px;flex-wrap:wrap}.val-count{padding:8px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:11px;font-weight:800}
.val-count.bad{color:var(--bad)}.val-count.warn{color:var(--warn)}.val-count.good{color:var(--good)}
.issue-list{display:grid;gap:8px}.issue{display:grid;grid-template-columns:74px 150px minmax(180px,1fr) minmax(220px,1.3fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px 11px}
.issue .sev{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.issue.bad .sev{color:var(--bad)}.issue.warn .sev{color:var(--warn)}.issue.good .sev{color:var(--good)}
.issue .where{font-weight:800;font-size:11px}.issue .what,.issue .fix{font-size:11px;color:var(--muted);line-height:1.45}.issue .fix b{color:var(--text)}
.net-chain{display:flex;align-items:stretch;gap:8px;overflow:auto;padding:4px 0 10px}
.net-node{min-width:155px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;position:relative}

.preset-chip.exact{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.preset-chip.family{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.preset-chip.modified{color:var(--warn)}
.preset-source{font-size:8px;color:var(--accent);text-decoration:none}.preset-source:hover{text-decoration:underline}
.preset-u{padding:2px 5px!important;min-height:22px!important;font-size:7px!important}
.preset-library{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.preset-card{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:10px}
.preset-card h4{margin:0 0 5px;font-size:10px}.preset-card p{margin:0;color:var(--muted);font-size:8px;line-height:1.45}
@media(max-width:820px){.preset-cell{min-width:200px}.preset-select{min-width:190px}}


/* ===== V9.9 Assistant Reviewer ===== */
.a-plan-list{display:grid;gap:8px;margin-top:8px}
.a-plan{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px}
.a-plan-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.a-plan-head b{font-size:10px}.a-plan-tag{font-size:7px;font-weight:800;padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.a-plan-note{font-size:8px;color:var(--muted);line-height:1.45;margin-top:5px}
.a-plan .a-actions{margin-top:6px}
.a-diff{width:100%;border-collapse:collapse;margin-top:7px;font-size:8px}
.a-diff th,.a-diff td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right}
.a-diff th:first-child,.a-diff td:first-child{text-align:left;color:var(--muted)}
.a-diff th{font-size:7px;background:var(--panel2)}
.a-diff .better{color:var(--good);font-weight:800}.a-diff .worse{color:var(--warn);font-weight:800}
.a-impact-chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:7px 0}
.a-impact-chain span{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:3px 5px;font-size:8px;font-weight:750}
.a-impact-chain i{color:var(--muted);font-style:normal}
.a-impact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:7px}
.a-impact-metric{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:6px}
.a-impact-metric span{display:block;font-size:7px;color:var(--muted)}.a-impact-metric b{display:block;margin-top:2px;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}
.a-review-scope{margin-top:7px;padding:6px 7px;border-left:2px solid var(--warn);background:var(--panel);font-size:8px;color:var(--muted);line-height:1.45}
.a-plan-stale{color:var(--warn);font-weight:800}

let uiPrefs={sidebarCollapsed:false,compact:false,focus:false,lastPage:'overview',assistantWide:false};
try{uiPrefs=Object.assign(uiPrefs,JSON.parse(localStorage.getItem(UI94_KEY)||'{}'))}catch(_){}

function uiPageName(id){
 const special={overview:'navOverview',project:'navProject',loads:'navLoads',protection:'navProtection',ground:'navGround',economy:'navEconomy',report:'navReport'};
 if(special[id])return t(special[id]);
 if(id==='singleline')return slt('nav');if(id==='manual')return mbt('nav');if(id==='help')return ht('nav');if(id==='motors')return v8t('motors');
 if(['catalog','coordination','variants'].includes(id))return v9t(id);

 {key:'core',items:[['overview','◫'],['project','⌁'],['loads','⚙'],['network','⌘']]},
 {key:'engineering',items:[['motors','M'],['catalog','CAT'],['protection','🛡'],['coordination','TCC'],['validation','✓'],['variants','A/B']]},

function uiPaletteKeys(e){
 const ids=JSON.parse($('uiPaletteList')?.dataset.ids||'[]');if(!ids.length)return;

}

 if(e.key==='Escape'&&$('uiPaletteOverlay')?.classList.contains('open'))uiClosePalette();

function motorPresetMeta(l){
 const p=motorPreset(l.catalogMotorPreset);if(!p)return'';
 const mismatch=Math.abs(val(state.lv)-p.voltage)>1;
 return `<div class="preset-meta"><span class="preset-chip exact">${p98t('exact')}</span><span>${p.effClass} · ${p.poles}p · ${p.voltage} V · ${p.frame}</span>${l.catalogModified?`<span class="preset-chip modified">${p98t('modified')}</span>`:''}${mismatch?`<span class="preset-chip modified">U ${state.lv}≠${p.voltage} V</span>`:''}${presetLink(p.source)}</div>`;

function trafoPresetMeta(tr,i){

}
function applyMotorPreset(i,id){
 v7PushSnapshot();const l=state.loads[i];if(!l)return;
 if(!id){delete l.catalogMotorPreset;delete l.catalogModel;delete l.catalogSource;delete l.catalogRatedVoltage;delete l.catalogModified;refresh();v7Autosave();return}
 const p=motorPreset(id);if(!p)return;
 Object.assign(l,{type:(l.type==='motor'||l.type==='vent')?l.type:'motor',kw:p.kw,eta:p.eta,pf:p.pf,catalogMotorPreset:p.id,catalogBrand:p.brand,catalogModel:p.model,catalogSource:p.source,catalogRatedVoltage:p.voltage,catalogEffClass:p.effClass,catalogPoles:p.poles,catalogFrame:p.frame,catalogModified:false});
 if(Math.abs(val(state.lv)-p.voltage)>1)v7Toast(`${p98t('voltageMismatch')}: ${p.voltage} V vs ${state.lv} V`);
 refresh();v7Autosave();
}
function applyTrafoPreset(i,id){
 v7PushSnapshot();const tr=state.transformers[i];if(!tr)return;
 if(!id){delete tr.catalogTrafoPreset;delete tr.catalogModel;delete tr.catalogSource;delete tr.catalogHV;delete tr.catalogLV;delete tr.catalogModified;refresh();v7Autosave();return}
 const p=trafoPreset(id);if(!p)return;

 refresh();v7Autosave();
}
function applyTrafoPresetVoltage(i){const tr=state.transformers[i],p=trafoPreset(tr?.catalogTrafoPreset);if(!p)return;v7PushSnapshot();state.hv=p.hv;state.lv=p.lv;refresh();v7Autosave()}

/* ----- Coordination / TCC pre-check ----- */
function catTripBand(d){
 if(!d)return null;
 if(d.kind==='mcb')return {lo:d.in*d.iiMin,hi:d.in*d.iiMax,type:'mcb'};
 if(d.iiMin!=null&&d.iiMax!=null)return {lo:d.in*d.iiMin,hi:d.in*d.iiMax,type:'mccb'};
 return null;
}
function tccLog(v,min,max,p0,p1){return p0+(Math.log10(v)-Math.log10(min))/(Math.log10(max)-Math.log10(min))*(p1-p0)}
function tccY(t){const min=.01,max=10000;return 455-(Math.log10(t)-Math.log10(min))/(Math.log10(max)-Math.log10(min))*410}
function tccX(i,maxI){return tccLog(Math.max(1,i),1,maxI,60,625)}
function tccMcbPath(d,maxI,cls){
 const b=catTripBand(d),In=d.in,low=d.in<=32?1:1, t255=d.in<=32?60:120;
 const pts=[[1.13*In,3600],[1.45*In,3600],[2.55*In,t255],[b.hi,.1],[b.hi,.01]];
 return `<polyline class="${cls}" points="${pts.map(p=>`${tccX(p[0],maxI)},${tccY(p[1])}`).join(' ')}"/>`;
}
function tccPickupBand(d,maxI,cls){
 const b=catTripBand(d);if(!b)return'';
 const x1=tccX(b.lo,maxI),x2=tccX(b.hi,maxI),y1=tccY(.01),y2=tccY(.2);
 return `<rect class="${cls}" x="${Math.min(x1,x2)}" y="${y2}" width="${Math.max(2,Math.abs(x2-x1))}" height="${y1-y2}" rx="3"/>`;
}
function tccChart(up,down,Ik){
 const maxI=Math.max(1000,Ik*2,(up?.in||1)*50,(down?.in||1)*50),xs=[1,10,100,1000,10000,100000].filter(x=>x<=maxI*1.1),ts=[.01,.1,1,10,100,1000,10000];
 let grid=xs.map(x=>`<line class="tcc-grid" x1="${tccX(x,maxI)}" y1="35" x2="${tccX(x,maxI)}" y2="455"/><text class="tcc-lab" x="${tccX(x,maxI)}" y="474" text-anchor="middle">${x>=1000?(x/1000)+'k':x}</text>`).join('');
 grid+=ts.map(ti=>`<line class="tcc-grid" x1="60" y1="${tccY(ti)}" x2="625" y2="${tccY(ti)}"/><text class="tcc-lab" x="52" y="${tccY(ti)+3}" text-anchor="end">${ti}</text>`).join('');
 const fault=`<line class="tcc-fault" x1="${tccX(Ik,maxI)}" y1="35" x2="${tccX(Ik,maxI)}" y2="455"/><text class="tcc-title" x="${Math.min(610,tccX(Ik,maxI)+5)}" y="50">Ik ${fmt(Ik/1000,2)} kA</text>`;
 let curves='';
 if(up?.kind==='mcb')curves+=tccMcbPath(up,maxI,'tcc-up');
 curves+=tccPickupBand(up,maxI,'tcc-band-up');
 if(down?.kind==='mcb')curves+=tccMcbPath(down,maxI,'tcc-down');
 curves+=tccPickupBand(down,maxI,'tcc-band-down');
 return `<svg viewBox="0 0 660 500"><text class="tcc-title" x="335" y="18" text-anchor="middle">Time–current coordination pre-check</text>${grid}<line class="tcc-axis" x1="60" y1="455" x2="625" y2="455"/><line class="tcc-axis" x1="60" y1="35" x2="60" y2="455"/>${curves}${fault}<text class="tcc-lab" x="340" y="495" text-anchor="middle">Current, A (log)</text><text class="tcc-lab" transform="translate(12 245) rotate(-90)" text-anchor="middle">Time, s (log)</text></svg>`;
}
function coordResult(up,down,f){
 const out=[];
 if(!up||!down)return[{state:'bad',title:'Catalog',text:'Select compatible upstream and downstream devices.'}];
 out.push({state:up.icu>=C.IkBusIcu/1000?'good':'bad',title:v9t('breaking'),text:`${up.model}: Icu ${up.icu} kA vs screened prospective current at QF1 ${fmt(C.IkBusIcu/1000,2)} kA`});
 out.push({state:down.icu>=C.grshIkIcu/1000?'good':'bad',title:v9t('breaking'),text:`${down.model}: Icu ${down.icu} kA vs screened prospective current at feeder breaker ${fmt(C.grshIkIcu/1000,2)} kA`});
 const ub=catTripBand(up),db=catTripBand(down);
 if(ub&&db){
  const separated=ub.lo>db.hi;
  out.push({state:separated?'good':'warn',title:v9t('instantaneous'),text:separated?`Pickup bands separated: downstream ≤${fmt(db.hi,0)} A, upstream ≥${fmt(ub.lo,0)} A.`:`Pickup bands overlap or touch (${fmt(db.lo,0)}–${fmt(db.hi,0)} A vs ${fmt(ub.lo,0)}–${fmt(ub.hi,0)} A).`});

function motorStartCalc(l,cab,grsh){

}

 if(!state.loads.length)add('bad','Loads','No consumer loads are defined.','Add at least one load before evaluating the project.');
 if(C.kvaTotal<C.reserveReq)add('bad','Transformers',`Installed ${fmt(C.kvaTotal,0)} kVA < required reserve ${fmt(C.reserveReq,1)} kVA.`,`Increase transformer capacity; preliminary recommendation ${C.recommended} kVA.`);
 else if(C.loadPct>85)add('warn','Transformers',`Loading is ${fmt(C.loadPct,0)}%.`,'Review reserve, ambient conditions and future expansion.');

 if(trsActive.length>1){
  const uks=trsActive.map(x=>val(x.uk)).filter(x=>x>0),umin=Math.min(...uks),umax=Math.max(...uks);
  add('warn','Transformers','The short-circuit model assumes all listed transformers operate in parallel on one common LV bus. Transformation ratio, vector group and circulating-current conditions are not modelled.','Before real parallel operation verify ratio/taps, vector group, phase sequence and manufacturer conditions for parallel operation.');
  if(uks.length>1&&umin>0&&umax/umin>1.10)add('warn','Transformers',`Uk values differ significantly (${fmt(umin,2)}% … ${fmt(umax,2)}%).`,'Review load sharing and parallel-operation compatibility using transformer manufacturer data.');
 }
 if(!C.main)add('bad','W1',`No main-cable solution within the built-in search range.`,`Increase section/runs, reduce length/load, or verify installation ampacity using catalogue data.`);
 else{
  if(C.main.dUpct>state.maxDrop)add('bad','W1',`Voltage drop ${fmt(C.main.dUpct,2)}% exceeds ${state.maxDrop}%.`,'Increase conductor cross-section or use parallel runs.');

  if(C.main.runs>1)add('warn','W1',`${C.main.runs} parallel main-cable runs are assumed to share current equally.`,'Verify equal lengths, routing, terminations and grouping correction factors.');
 }
 if(C.mainIcu<C.IkBus/1000*1.1)add('bad','QF1',`Required breaking capacity exceeds selected level ${C.mainIcu} kA.`,'Select a breaker with Icu/Ics above prospective short-circuit current including design margin.');

 if(mbCat&&!catBreakerValid(mbCat,C.I,C.mainIcu))add('bad','QF1 / catalog',`${mbCat.brand} ${mbCat.model} is below calculated current or breaking capacity.`,`Choose a catalog breaker with In ≥ ${fmt(C.I,1)} A and Icu ≥ ${C.mainIcu} kA.`);
 C.feederRows.forEach((f,i)=>{
  const bd=catGetBreakerFeeder(f);if(bd&&!catBreakerValid(bd,f.I,C.feedIcu))add('bad',`QF${i+2} / catalog`,`${bd.brand} ${bd.model} does not satisfy the feeder requirement.`,`Select In ≥ ${fmt(f.I,1)} A and Icu ≥ ${C.feedIcu} kA.`);

   if(f.startMethod==='vfd'){const vd=catGetVfd(f);if(vd&&vd.kw<f.kw)add('bad',`${f.name} / VFD`,`${vd.model} ${vd.kw} kW < motor ${f.kw} kW.`,'Choose a larger drive and verify duty/current/overload requirements.')}

 });

 }

function slAutoLayout(){

 v7PushSnapshot();
 const nodes=Object.fromEntries(d.nodes.map(n=>[n.id,n])),ind={};d.nodes.forEach(n=>ind[n.id]=0);
 d.links.forEach(l=>{if(nodes[l.a]&&nodes[l.b])ind[l.b]=(ind[l.b]||0)+1});
 let roots=d.nodes.filter(n=>!ind[n.id]);if(!roots.length)roots=[d.nodes[0]];
 const level={},q=roots.map(n=>n.id);roots.forEach(n=>level[n.id]=0);
 while(q.length){const id=q.shift(),lv=level[id];d.links.filter(l=>l.a===id&&nodes[l.b]).forEach(l=>{if(level[l.b]==null||level[l.b]<lv+1){level[l.b]=lv+1;q.push(l.b)}})}
 d.nodes.forEach(n=>{if(level[n.id]==null)level[n.id]=0});
 const groups={};d.nodes.forEach(n=>(groups[level[n.id]]??=[]).push(n));
 Object.entries(groups).forEach(([lv,arr])=>arr.forEach((n,i)=>{n.x=60+Number(lv)*175;n.y=60+i*125}));
 slRenderInner();v7Autosave();
}

function v95t(k){return V95_I18N[lang]?.[k]||V95_I18N.ru[k]||k}
function vizCard(title,sub,body,badge=''){return `<div class="viz-card"><div class="viz-card-head"><div><h3>${title}</h3><p>${sub}</p></div>${badge?`<span class="viz-badge">${badge}</span>`:''}</div>${body}</div>`}
function vizBarRows(rows,{max=null,limit=null,suffix='',precision=1}={}){
 if(!rows?.length)return `<div class="viz-empty">${v95t('noData')}</div>`;
 const computed=Math.max(.000001,max??Math.max(1,...rows.map(r=>Number(r.value)||0),Number(limit)||0));
 return `<div class="viz-bars">${rows.map(r=>{
  const value=Math.max(0,Number(r.value)||0),pct=Math.min(100,100*value/computed),lim=limit!=null?Math.min(100,100*Number(limit)/computed):null;
  const cls=r.cls||((limit!=null&&value>limit)?'bad':'');
  return `<div class="viz-row"><div class="viz-label" title="${esc(r.label)}">${r.ref?`<b>${esc(r.ref)}</b> · `:''}${esc(r.label)}</div><div class="viz-track">${lim!=null?`<span class="viz-limit" style="left:${lim}%"></span>`:''}<span class="viz-fill ${cls}" style="width:${pct}%"></span></div><div class="viz-value">${fmt(value,precision)}${suffix}${r.sub?`<small>${esc(r.sub)}</small>`:''}</div></div>`;
 }).join('')}</div>`;
}
function vizStack(parts){
 const total=parts.reduce((a,x)=>a+Math.max(0,Number(x.value)||0),0)||1;
 return `<div class="viz-stack">${parts.map((p,i)=>`<span title="${esc(p.label)} · ${fmt(p.value,1)}" class="${i===0?'a':i===1?'b':'c'}" style="width:${100*Math.max(0,p.value)/total}%"></span>`).join('')}</div><div class="viz-legend">${parts.map((p,i)=>`<span><i class="viz-dot ${i===1?'b':i===2?'c':''}"></i>${esc(p.label)} ${fmt(100*Math.max(0,p.value)/total,0)}%</span>`).join('')}</div>`;
}
function vizDonut(value,max,label,sub=''){
 const ratio=max>0?Math.max(0,value/max):0,shown=Math.min(1,ratio),r=48,c=2*Math.PI*r,dash=c*shown,cls=ratio>1?'bad':ratio>.85?'warn':'';
 return `<div class="viz-donut-wrap"><svg class="viz-donut" viewBox="0 0 120 120" role="img" aria-label="${esc(label)} ${fmt(ratio*100,0)}%"><circle class="viz-donut-bg" cx="60" cy="60" r="${r}"/><circle class="viz-donut-ring ${cls}" cx="60" cy="60" r="${r}" stroke-dasharray="${dash} ${Math.max(0,c-dash)}" transform="rotate(-90 60 60)"/><text class="viz-donut-value" x="60" y="58" text-anchor="middle">${fmt(ratio*100,0)}%</text><text class="viz-donut-sub" x="60" y="73" text-anchor="middle">${esc(label)}</text></svg><div class="viz-summary"><div class="viz-summary-row"><span>${v95t('apparent')}</span><b>${fmt(value,1)} kVA</b></div><div class="viz-summary-row"><span>Σ T</span><b>${fmt(max,0)} kVA</b></div><div class="viz-summary-row"><span>${v7t('margin')}</span><b>${fmt(max-value,1)} kVA</b></div>${sub?`<div class="viz-note">${sub}</div>`:''}</div></div>`;
}
function vizPowerBalance(c){
 const qAfter=Math.max(0,c.Q-c.capStep),max=Math.max(1,c.S0,c.S,c.P,c.Q,qAfter);
 return vizBarRows([
  {label:`${v95t('active')} · ${v95t('before')}`,value:c.P,cls:'good'},
  {label:`${v95t('reactive')} · ${v95t('before')}`,value:c.Q,cls:'alt'},
  {label:`${v95t('reactive')} · ${v95t('after')}`,value:qAfter,cls:'alt'},
  {label:`${v95t('apparent')} · ${v95t('before')}`,value:c.S0},
  {label:`${v95t('apparent')} · ${v95t('after')}`,value:c.S,cls:'good'}
 ],{max,precision:1})+`<div class="viz-note">P: kW · Q: kvar · S: kVA · Qc step ${fmt(c.capStep,0)} kvar</div>`;
}
function vizLoadMix(c){
 const rows=c.loads.map((l,i)=>({label:l.name||`Load ${i+1}`,ref:`L${i+1}`,value:l.P})).sort((a,b)=>b.value-a.value).slice(0,10);
 return vizBarRows(rows,{suffix:' kW',precision:1});
}
function vizVoltageDrops(c){
 const rows=[];if(c.main)rows.push({label:v95t('main'),ref:'W1',value:c.main.dUpct});
 c.feederRows.forEach((f,i)=>{if(f.cab)rows.push({label:f.name,ref:`W${i+2}`,value:f.cab.dUpct})});
 const mx=Math.max(state.maxDrop*1.35,...rows.map(x=>x.value),1);
 return vizBarRows(rows,{max:mx,limit:state.maxDrop,suffix:'%',precision:2})+`<div class="viz-note">Each bar is the voltage drop of that cable section, not a cumulative end-to-end total.</div>`;
}
function vizCableUtil(c){
 const rows=[];if(c.main)rows.push({label:v95t('main'),ref:'W1',value:c.main.Iz?100*c.I/c.main.Iz:0,sub:`${fmt(c.I,0)}/${fmt(c.main.Iz,0)} A`});
 c.feederRows.forEach((f,i)=>{if(f.cab)rows.push({label:f.name,ref:`W${i+2}`,value:f.cab.Iz?100*f.I/f.cab.Iz:0,sub:`${fmt(f.I,0)}/${fmt(f.cab.Iz,0)} A`})});
 return vizBarRows(rows,{max:120,limit:100,suffix:'%',precision:0});
}
function vizFaultLevels(c){
 const rows=[{label:'LV bus',ref:'T/LV',value:c.IkBus/1000},{label:'MDB',ref:'W1 end',value:c.grsh.Ik/1000}];
 c.feederRows.forEach((f,i)=>{if(f.cab)rows.push({label:f.name,ref:`W${i+2} end`,value:f.cab.IkEnd/1000})});
 return vizBarRows(rows,{suffix:' kA',precision:2});
}
function vizMotorCurrents(c){
 const ms=c.feederRows.filter(f=>(f.type==='motor'||f.type==='vent')&&f.start);
 if(!ms.length)return `<div class="viz-empty">${v95t('noData')}</div>`;
 const max=Math.max(1,...ms.map(f=>f.start.Istart));
 return `<div class="viz-bars">${ms.map(f=>`<div class="viz-motor"><div class="viz-motor-head"><b>${esc(f.name)}</b><span>${v8t(f.startMethod||'dol')} · ${fmt(f.start.startK,1)}×</span></div><div class="viz-motor-bars"><div class="viz-mini-track" title="${v95t('rated')} ${fmt(f.start.Iunit,1)} A"><i style="width:${100*f.start.Iunit/max}%"></i></div><div class="viz-mini-track" title="${v95t('starting')} ${fmt(f.start.Istart,1)} A"><i class="start" style="width:${100*f.start.Istart/max}%"></i></div></div><div class="viz-legend"><span><i class="viz-dot"></i>${v95t('rated')} ${fmt(f.start.Iunit,1)} A</span><span><i class="viz-dot b"></i>${v95t('starting')} ${fmt(f.start.Istart,1)} A</span></div></div>`).join('')}</div>`;
}
function vizMotorDip(c){
 const rows=c.feederRows.filter(f=>(f.type==='motor'||f.type==='vent')&&f.start).map((f,i)=>({label:f.name,ref:`M${i+1}`,value:f.start.dUpct}));
 return vizBarRows(rows,{max:Math.max(18,...rows.map(x=>x.value),1),limit:10,suffix:'%',precision:1})+`<div class="viz-note">10% is a visual reference line only; acceptable starting dip depends on the process, motor and connected equipment.</div>`;
}
function vizLosses(c){
 const rows=[{label:v95t('main'),ref:'W1',value:c.loss||0}];
 c.feederRows.forEach((f,i)=>rows.push({label:f.name,ref:`W${i+2}`,value:f.lossKw||0}));
 return vizBarRows(rows.sort((a,b)=>b.value-a.value),{suffix:' kW',precision:3});
}
function vizLossMoney(c){
 const main=(c.loss||0)*state.hours*state.price,feed=c.feederRows.reduce((a,f)=>a+(f.lossCost||0),0);
 return `${vizStack([{label:v95t('main'),value:main},{label:v95t('feeders'),value:feed}])}<div class="viz-summary" style="margin-top:10px"><div class="viz-summary-row"><span>${v95t('main')}</span><b>${fmt(main,0)} MDL/y</b></div><div class="viz-summary-row"><span>${v95t('feeders')}</span><b>${fmt(feed,0)} MDL/y</b></div><div class="viz-summary-row"><span>Total</span><b>${fmt(main+feed,0)} MDL/y</b></div></div>`;
}

function pageHead(title,sub,extra=''){return `<div class="page-head"><div><h2>${t(title)}</h2><p>${t(sub)}</p></div>${extra}</div>`}
function kpi(label,value,sub=''){const key=encodeURIComponent(String(label).replace(/<[^>]*>/g,'')).replace(/'/g,'%27');return `<div class="kpi"><button class="why-btn no-print" onclick="assistantExplainMetric(decodeURIComponent('${key}'))" title="Why?">?</button><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function field(label,id,value,type='number',attrs=''){return `<div class="field"><label for="${id}"><span>${t(label)}</span></label><input id="${id}" type="${type}" value="${value}" ${attrs}></div>`}
function sel(label,id,opts,value){return `<div class="field"><label for="${id}"><span>${t(label)}</span></label><select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(value)?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
function fieldRaw(label,id,value,type='number',attrs=''){return `<div class="field"><label for="${id}"><span>${label}</span></label><input id="${id}" type="${type}" value="${value}" ${attrs}></div>`}
function selRaw(label,id,opts,value){return `<div class="field"><label for="${id}"><span>${label}</span></label><select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(value)?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}

function healthItem(label,stateKey,value){return `<div class="health-item"><div class="row"><b><span class="dot ${stateKey}"></span>${t(label)}</b><span class="status-${stateKey}">${value}</span></div></div>`}

 const active=document.querySelector('.page.active')?.id||uiPrefs.lastPage||'overview';
 $('sidebar').innerHTML=uiNavDefinition().map(g=>`<div class="nav-group"><div class="nav-group-label">${ui94t(g.key)}</div>${g.items.map(([id,icon])=>`<button class="navbtn ${id===active?'active':''}" data-page="${id}" onclick="go('${id}')" title="${esc(uiPageName(id))}"><span class="nav-icon">${icon}</span><span class="nav-label">${uiPageName(id)}</span></button>`).join('')}</div>`).join('')+`<div class="side-note">${t('eduWarning')}</div>`;

function go(id,scroll=true,remember=true){
 document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));
 document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===id));
 if(id==='report')renderReport();
 if(remember){uiPrefs.lastPage=id;uiSavePrefs();try{history.replaceState(null,'','#'+id)}catch(_){}}
 if(scroll)window.scrollTo({top:0,behavior:'smooth'});
 if(typeof uiUpdateChrome==='function')uiUpdateChrome(id);
}

function renderReport(){C=calc();$('report').innerHTML=pageHead('reportTitle','reportSub',`<button class="primary no-print" onclick="window.print()">🖨 ${t('printPdf')}</button>`)+`<article class="report" id="reportDoc"><div class="split"><div><h2>ElectroEngineer — ${esc(state.projectName)}</h2><div class="hint">Dorin Monolatii · F.E.I.E. U.T.M.</div></div><div class="code-pill">${new Date().toLocaleDateString(lang==='ro'?'ro-RO':lang==='en'?'en-GB':'ru-RU')}</div></div><p>${t('reportIntro')}</p><div class="report-section"><h3>${t('calcResults')}</h3><div class="kpis">${kpi('P',fmt(C.P,2)+' kW','')}${kpi('Q',fmt(C.Q,2)+' kvar','')}${kpi('S',fmt(C.S,2)+' kVA','')}${kpi('I',fmt(C.I,2)+' A','')}${kpi('Qc',fmt(C.Qc,2)+' kvar','')}${kpi('cosφ',fmt(C.pf,3),'')}</div></div><div class="report-section"><h3>${t('transformers')}</h3><p>${t('recommended')}: <b>${C.recommended} kVA</b>. ${t('loadPct')}: <b>${fmt(C.loadPct,1)}%</b>. ${t('n1')}: <b>${t(C.S1?(C.n1ok?'n1Ok':'n1Bad'):'noCat1')}</b>.</p></div><div class="report-section"><h3>${t('loadsCard')}</h3><table class="report-table"><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>P</th><th>Q</th><th>I</th><th>${t('cat')}</th></tr></thead><tbody>${C.loads.map(x=>`<tr><td>${esc(x.name)}</td><td>${t(x.type)}</td><td>${fmt(x.P,2)} kW</td><td>${fmt(x.Q,2)} kvar</td><td>${fmt(x.I,1)} A</td><td>${x.cat}</td></tr>`).join('')}</tbody></table></div><div class="report-section"><h3>${t('protectionTitle')}</h3><p>${t('busFault')}: <b>${fmt(C.IkBus/1000,2)} kA</b>. ${t('grshFault')}: <b>${fmt(C.grsh.Ik/1000,2)} kA</b>.</p><p>${t('mainCable')}: <b>${C.main?`${C.main.runs}×${C.main.size} mm² ${state.material}`:'—'}</b>; ${v8t('mainPen')}: <b>${C.mainPe?C.mainPe.size+' mm²':'—'}</b>; ${t('breaker')}: <b>${C.main?C.main.br:'—'} A / Icu ${C.mainIcu} kA</b>; ${t('drop')}: <b>${C.main?fmt(C.main.dUpct,2):'—'}%</b>.</p><p>${v8t('earthingSystem')}: <b>${state.protection.system}</b>; ${v8t('totalLoss')}: <b>${fmt(C.totalLossKw,2)} kW</b> (${fmt(C.totalLossCost,0)} MDL/y).</p></div><div class="report-section"><h3>${t('earthResult')}</h3><p><b>${fmt(C.Rg,2)} Ω</b> / ${t('targetWord')} ${state.ground.target} Ω. SPD: ${C.spd}.</p></div><div class="report-section"><h3>${t('economyTitle')}</h3><p>${t('energy')}: <b>${fmt(C.energy,0)} kWh/y</b>; ${t('energyCost')}: <b>${fmt(C.cost,0)} MDL/y</b>; ${t('lossSaving')}: <b>${fmt(C.lossSaving,0)} MDL/y</b>.</p></div>
<div class="report-section"><h3>${v7t('validation')}</h3><p>${(()=>{const V=v7Validate();return `Screening score <b>${V.score}/100</b> · ${v7t('critical')}: <b>${V.bad}</b> · ${v7t('warnings')}: <b>${V.warn}</b>`})()}</p></div>
<div class="report-section"><h3>${v7t('cables')}</h3>${v7CableTable(v7CableSchedule())}</div>
<div class="report-section"><h3>${t('singleLine')}</h3><div class="diagram" id="reportDiagram"></div></div><div class="note"><strong>!</strong> ${t('eduWarning')}</div></article>`;setTimeout(()=>renderDiagram('reportDiagram'),0)}
function renderDiagram(target='diagram'){const e=$(target);if(!e)return;C=calc();const tr=state.transformers.map(x=>`${esc(x.name)} ${x.kva} kVA · Uk ${x.uk}%`).join(' + ');const mc=C.main?`${C.main.runs}×${C.main.size} mm²`:'—';e.innerHTML=`<svg viewBox="0 0 1180 310"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker></defs><g fill="none" class="d-line" marker-end="url(#arr)"><path d="M140 130H235"/><path d="M390 130H480"/><path d="M640 130H735"/><path d="M900 130H995"/></g>${dbox(20,85,120,90,'MV',state.hv+' kV')}${dbox(235,80,155,100,'MV switchgear',fmt(C.IkBus/1000,1)+' kA LV equiv.')}${dbox(480,65,160,130,'Transformer',tr+' · Uk')}${dbox(735,75,165,110,'Main cable',mc+' · ΔU '+(C.main?fmt(C.main.dUpct,2):'—')+'%')}${dbox(995,75,160,110,'MDB',fmt(C.grsh.Ik/1000,1)+' kA')}<line x1="1075" y1="185" x2="1075" y2="255" class="d-bus"/>${dbox(280,235,150,65,'Cat. I',fmt(C.S1,1)+' kVA')}${dbox(515,235,150,65,'Motors',state.loads.filter(x=>x.type==='motor').length+' circuits')}${dbox(750,235,150,65,'Other loads',Math.max(0,state.loads.length-state.loads.filter(x=>x.type==='motor').length)+' circuits')}<path d="M1075 255H900" class="d-line" fill="none"/><path d="M1075 255H665" class="d-line" fill="none"/><path d="M1075 255H430" class="d-line" fill="none"/></svg>`}
function dbox(x,y,w,h,a,b){return `<rect class="d-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/><text class="d-title" x="${x+w/2}" y="${y+34}" text-anchor="middle">${a}</text><text class="d-sub" x="${x+w/2}" y="${y+58}" text-anchor="middle">${b}</text>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){ensureV7State();nav();renderOverview();renderProject();renderLoads();renderNetwork();renderMotors();renderCatalog();renderProtection();renderCoordination();renderValidation();renderVariants();renderSingleLine();renderDocuments();renderGround();renderEconomy();renderManual();renderHelp();if($('report').classList.contains('active'))renderReport();applyStaticI18n();v7UpdateHistoryButtons();if(typeof assistantEnsureUI==='function'){assistantEnsureUI();assistantRefreshStatus();}if(typeof uiEnsureShell==='function')uiEnsureShell();}
function applyStaticI18n(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').value=lang;document.documentElement.lang=lang}
function syncFromInputs(){const map=['projectName','hv','lv','ks','targetPf','sourceSk','mainLength','maxDrop','faultTime','material','insulation','derating','hours','price'];for(const id of map){const e=$(id);if(!e)continue;state[id]=['projectName','material','insulation'].includes(id)?e.value:val(e.value,state[id]);}const gm={gRho:'rho',gRods:'rods',gLen:'len',gEff:'eff',gTarget:'target',gLps:'lps',gEntry:'entry'};for(const [id,k] of Object.entries(gm)){const e=$(id);if(e)state.ground[k]=['lps','entry'].includes(k)?e.value:val(e.value,state.ground[k]);}const pm={earthingSystem:'system',mcbCurve:'curve',rcdMainMa:'rcdMainMa',rcdFinalMa:'rcdFinalMa',touchVoltage:'touchVoltage'};for(const [id,k] of Object.entries(pm)){const e=$(id);if(e)state.protection[k]=['system','curve'].includes(k)?e.value:val(e.value,state.protection[k]);}const em={capPrice:'capPrice',trafoCost:'trafoCost',cableCost:'cableCost',switchCost:'switchCost',installCost:'installCost'};for(const [id,k] of Object.entries(em)){const e=$(id);if(e)state.econ[k]=val(e.value,state.econ[k]);}}
function refresh(){syncFromInputs();const active=document.querySelector('.page.active')?.id||uiPrefs.lastPage||'overview';render();go(active,false,false)}
function setTrafo(i,k,v){v7PushSnapshot();const tr=state.transformers[i];tr[k]=k==='name'?v:val(v);if(tr.catalogTrafoPreset&&['kva','uk'].includes(k))tr.catalogModified=true;refresh();v7Autosave()}
function addTrafo(){v7PushSnapshot();state.transformers.push({name:'T'+(state.transformers.length+1),kva:630,uk:6});refresh();v7Autosave()}
function delTrafo(i){if(state.transformers.length>1){v7PushSnapshot();state.transformers.splice(i,1);refresh();v7Autosave()}}
function setLoad(i,k,v){v7PushSnapshot();const l=state.loads[i];l[k]=['name','type','cat','startMethod'].includes(k)?v:val(v);if(l.catalogMotorPreset&&['kw','eta','pf'].includes(k))l.catalogModified=true;if(k==='type'&&!(v==='motor'||v==='vent')){delete l.catalogMotorPreset;delete l.catalogModel;delete l.catalogSource;delete l.catalogModified}refresh();v7Autosave()}
function setLoadStartMethod(i,v){v7PushSnapshot();state.loads[i].startMethod=v;state.loads[i].startK=startMethodData(v).k;refresh();v7Autosave()}
function addLoad(){v7PushSnapshot();state.loads.push({name:'Load '+(state.loads.length+1),type:'other',qty:1,kw:5,eta:1,pf:.9,ku:1,cat:'III',len:30,startMethod:'custom',startK:1});refresh();v7Autosave()}
function delLoad(i){v7PushSnapshot();state.loads.splice(i,1);refresh();v7Autosave()}
function clearLoads(){if(confirm(t('confirmClear'))){v7PushSnapshot();state.loads=[];refresh();v7Autosave()}}
function demo(){v7PushSnapshot();state.loads=[{name:'Конвейер M1',type:'motor',qty:1,kw:15,eta:.91,pf:.84,ku:1,cat:'I',len:45,startMethod:'dol',startK:6.5},{name:'Насосы',type:'motor',qty:2,kw:7.5,eta:.9,pf:.82,ku:.8,cat:'II',len:60,startMethod:'dol',startK:6.5},{name:'Освещение',type:'lighting',qty:1,kw:12,eta:1,pf:.95,ku:.9,cat:'III',len:70,startMethod:'custom',startK:1}];refresh();v7Autosave()}
function saveProject(show=true){syncFromInputs();ensureV7State();localStorage.setItem(V7_KEY,JSON.stringify(state));localStorage.setItem(V7_AUTO,JSON.stringify(state));if(show)v7Toast(ui94t('saved'))}
function loadProject(){const x=localStorage.getItem(V7_KEY)||localStorage.getItem(V7_AUTO)||localStorage.getItem('EE_STUDIO_V9')||localStorage.getItem('EE_STUDIO_V9_AUTOSAVE')||localStorage.getItem('EE_STUDIO_V8')||localStorage.getItem('EE_STUDIO_V8_AUTOSAVE')||localStorage.getItem('EE_STUDIO_V7')||localStorage.getItem('EE_STUDIO_V7_AUTOSAVE')||localStorage.getItem('EE_STUDIO_V4');if(!x)return v7Toast(ui94t('noSaved'));try{v7PushSnapshot();state=JSON.parse(x);ensureV7State();refresh();v7Toast(ui94t('loaded'))}catch(e){v7Toast(ui94t('noSaved'))}}
Object.assign(window,{setTrafo,addTrafo,delTrafo,setLoad,setLoadStartMethod,addLoad,delLoad,clearLoads,demo,saveProject,loadProject});
document.addEventListener('focusin',e=>{if(e.target.closest('.page')&&!e.target.classList.contains('cell-input')&&['INPUT','SELECT'].includes(e.target.tagName))v7EditStart=JSON.stringify(state)});
document.addEventListener('change',e=>{
 if(e.target.id==='lang'){lang=e.target.value;localStorage.setItem('EE_LANG',lang);const active=document.querySelector('.page.active')?.id||uiPrefs.lastPage||'overview';render();go(active,false,false);uiEnsureShell();return}
 if(e.target.id==='catBreakerBrand'){catSetPref('prefBreaker',e.target.value);return}
 if(e.target.id==='catMotorBrand'){catSetPref('prefMotor',e.target.value);return}
 if(e.target.id==='catDriveBrand'){catSetPref('prefDrive',e.target.value);return}
 if(e.target.id==='tccFeeder'){catSetTcc(e.target.value);return}
 if(e.target.closest('.page')&&!e.target.classList.contains('cell-input')){if(v7EditStart)v7PushSnapshot(v7EditStart);v7EditStart=null;refresh();v7Autosave()}
});
document.addEventListener('input',e=>{if(e.target.closest('.page')&&!e.target.classList.contains('cell-input')){clearTimeout(window.__eeTimer);window.__eeTimer=setTimeout(()=>{refresh();v7Autosave()},250)}});
$('themeBtn').onclick=()=>{const now=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=now;localStorage.setItem('EE_THEME',now);v7Toast(now==='dark'?'Dark mode':'Light mode')};document.documentElement.dataset.theme=localStorage.getItem('EE_THEME')||'dark';
try{const ax=localStorage.getItem(V7_AUTO)||localStorage.getItem('EE_STUDIO_V9_AUTOSAVE')||localStorage.getItem('EE_STUDIO_V8_AUTOSAVE')||localStorage.getItem('EE_STUDIO_V7_AUTOSAVE');if(ax){const ap=JSON.parse(ax);if(ap&&Array.isArray(ap.loads)&&Array.isArray(ap.transformers))state=ap}}catch(_){}
ensureV7State();render();v7UpdateHistoryButtons();uiInit();if(state.assistant?.open)setTimeout(()=>assistantOpen(),80);
setTimeout(()=>{if(localStorage.getItem('EE_HIDE_GUIDE')!=='1')showGuide()},180);
</script>
