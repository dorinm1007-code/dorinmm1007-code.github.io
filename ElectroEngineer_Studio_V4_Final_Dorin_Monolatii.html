 <div class="grid2"><div class="card"><h3>${t('calcResults')}</h3><div class="kpis">${kpi(t('apparentBefore'),fmt(C.S0,1)+' kVA',`cosφ ${fmt(C.pf0,3)}`)}${kpi(t('apparentAfter'),fmt(C.S,1)+' kVA',`cosφ ${fmt(C.pf,3)}`)}${kpi(t('capBank'),fmt(C.capStep,0)+' kvar','5 kvar step')}</div></div><div class="card"><h3>${t('transformers')}</h3><div class="split"><div><div class="hint">${t('loadPct')}</div><div style="font-size:28px;font-weight:900">${fmt(C.loadPct,0)}%</div></div><div style="min-width:46%"><div class="progress"><span style="width:${Math.min(100,C.loadPct)}%"></span></div><div class="hint">${fmt(C.S,1)} / ${fmt(C.kvaTotal,0)} kVA</div></div></div><div class="divider"></div><div class="split"><span>${t('recommended')}</span><b>${C.recommended} kVA</b></div><div class="split"><span>${t('n1')}</span><b class="status-${C.n1ok?'good':'warn'}">${t(C.S1? (C.n1ok?'n1Ok':'n1Bad'):'noCat1')}</b></div></div></div>
 <div class="card"><h3>${t('formulaNotes')}</h3><div class="grid2"><div><div class="formula">${t('formulaQ')}</div><div class="formula">${t('formulaQc')}</div><div class="formula">${t('formulaDU')}</div></div><div><div class="formula">${t('formulaSC')}</div><div class="formula">${t('formulaThermal')}</div><div class="formula">${t('formulaEarth')}</div></div></div><div class="note"><strong>!</strong> ${t('eduWarning')}</div></div>`;
}
function renderProject(){
 $('project').innerHTML=pageHead('projectTitle','projectSub')+`<div class="card"><h3>${t('projectTitle')}</h3><div class="grid">
 ${field('projectName','projectName',state.projectName,'text')}${sel('hvVoltage','hv',[[6,'6'],[10,'10'],[20,'20']],state.hv)}${sel('lvVoltage','lv',[[400,'400'],[380,'380']],state.lv)}${field('simult','ks',state.ks,'number','min="0" max="1" step="0.01"')}${field('targetPf','targetPf',state.targetPf,'number','min="0.5" max="0.999" step="0.01"')}${field('sourceSk','sourceSk',state.sourceSk,'number','min="1" step="10"')}${field('mainLength','mainLength',state.mainLength,'number','min="0"')}${field('maxDrop','maxDrop',state.maxDrop,'number','min="0.5" step="0.1"')}${field('faultTime','faultTime',state.faultTime,'number','min="0.01" max="5" step="0.01"')}${sel('material','material',[['Cu','Cu'],['Al','Al']],state.material)}${sel('insulation','insulation',[['PVC','PVC'],['XLPE','XLPE/EPR']],state.insulation)}${field('derating','derating',state.derating,'number','min="0.3" max="1.2" step="0.01"')}${field('hours','hours',state.hours,'number','min="0"')}${field('price','price',state.price,'number','min="0" step="0.01"')}
 </div><div class="note" style="margin-top:12px"><strong>Iz:</strong> ${t('approxAmp')}</div></div>
 <div class="card"><div class="card-title"><h3>${t('transformers')}</h3><button class="primary tiny no-print" onclick="addTrafo()">＋ ${t('addTrafo')}</button></div><div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('kva')}</th><th>${t('uk')}</th><th></th></tr></thead><tbody>${state.transformers.map((x,i)=>`<tr><td><input class="cell-input" value="${esc(x.name)}" onchange="setTrafo(${i},'name',this.value)"></td><td><input class="cell-input" type="number" value="${x.kva}" onchange="setTrafo(${i},'kva',this.value)"></td><td><input class="cell-input" type="number" step="0.1" value="${x.uk}" onchange="setTrafo(${i},'uk',this.value)"></td><td><button class="danger tiny" onclick="delTrafo(${i})">×</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>${t('singleLine')}</h3><div class="diagram" id="diagram"></div></div>`;
 setTimeout(renderDiagram,0);
}
function renderLoads(){C=calc();$('loads').innerHTML=pageHead('loadsTitle','loadsSub',`<div class="actions"><button class="secondary tiny" onclick="demo()">${t('demo')}</button><button class="danger tiny" onclick="clearLoads()">${t('clear')}</button><button class="primary tiny" onclick="addLoad()">＋ ${t('addLoad')}</button></div>`)+`
 <div class="card"><h3>${t('loadsCard')}</h3><div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>${t('qty')}</th><th>${t('power')}</th><th>${t('eta')}</th><th>${t('pf')}</th><th>${t('ku')}</th><th>${t('cat')}</th><th>${t('length')}</th><th>${t('startK')}</th><th></th></tr></thead><tbody>${state.loads.map((l,i)=>loadRow(l,i)).join('')}</tbody></table></div></div>
 <div class="card"><h3>${t('calcResults')}</h3><div class="kpis">${kpi(t('activePower'),fmt(C.P,2)+' kW','Ks='+state.ks)}${kpi(t('reactivePower'),fmt(C.Q,2)+' kvar','')}${kpi(t('apparentBefore'),fmt(C.S0,2)+' kVA',`cosφ ${fmt(C.pf0,3)}`)}${kpi(t('compensation'),fmt(C.Qc,2)+' kvar','')}${kpi(t('apparentAfter'),fmt(C.S,2)+' kVA',`cosφ ${fmt(C.pf,3)}`)}${kpi(t('currentAfter'),fmt(C.I,2)+' A','')}</div></div>`}
function loadRow(l,i){const types=['motor','lighting','heater','sockets','vent','other'];return `<tr><td><input class="cell-input" value="${esc(l.name)}" onchange="setLoad(${i},'name',this.value)"></td><td><select class="cell-input" onchange="setLoad(${i},'type',this.value)">${types.map(x=>`<option value="${x}" ${x===l.type?'selected':''}>${t(x)}</option>`).join('')}</select></td><td><input class="cell-input" type="number" value="${l.qty}" onchange="setLoad(${i},'qty',this.value)"></td><td><input class="cell-input" type="number" step="0.1" value="${l.kw}" onchange="setLoad(${i},'kw',this.value)"></td><td><input class="cell-input" type="number" step="0.01" value="${l.eta}" onchange="setLoad(${i},'eta',this.value)"></td><td><input class="cell-input" type="number" step="0.01" value="${l.pf}" onchange="setLoad(${i},'pf',this.value)"></td><td><input class="cell-input" type="number" step="0.01" value="${l.ku}" onchange="setLoad(${i},'ku',this.value)"></td><td><select class="cell-input" onchange="setLoad(${i},'cat',this.value)">${['I','II','III'].map(x=>`<option ${x===l.cat?'selected':''}>${x}</option>`).join('')}</select></td><td><input class="cell-input" type="number" value="${l.len}" onchange="setLoad(${i},'len',this.value)"></td><td><input class="cell-input" type="number" step="0.5" value="${l.startK}" onchange="setLoad(${i},'startK',this.value)"></td><td><button class="danger tiny" onclick="delLoad(${i})">×</button></td></tr>`}
function renderProtection(){C=calc();const m=C.main;$('protection').innerHTML=pageHead('protectionTitle','protectionSub')+`
 <div class="kpis">${kpi(t('busFault'),fmt(C.IkBus/1000,2)+' kA',`Icu ≥ ${C.mainIcu} kA`)}${kpi(t('grshFault'),fmt(C.grsh.Ik/1000,2)+' kA',`Icu ≥ ${C.feedIcu} kA`)}${kpi(t('sourceZ'),fmt(C.src.Zx*1000,2)+' mΩ','network + transformer')}${kpi(t('faultTime'),fmt(state.faultTime,2)+' s','adiabatic')}</div>
 <div class="card"><h3>${t('mainCable')}</h3>${m?`<div class="kpis">${kpi(t('cable'),`${m.runs} × ${m.size} mm²`,state.material+' '+state.insulation)}${kpi(t('ampacity'),fmt(m.Iz,0)+' A',`In ${m.br} A`)}${kpi(t('drop'),fmt(m.dUpct,2)+' %',`≤ ${state.maxDrop}%`)}${kpi(t('ikEnd'),fmt(m.Ik/1000,2)+' kA','')}${kpi(t('thermal'),fmt(m.Smin,1)+' mm²','per run')}${kpi(t('icu'),C.mainIcu+' kA',t('breaker'))}</div>`:`<div class="note"><strong>!</strong> ${t('cableFail')}</div>`}</div>
 <div class="card"><h3>${t('feeders')}</h3>${C.feederRows.length?`<div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>I</th><th>${t('cable')}</th><th>${t('breaker')}</th><th>${t('ampacity')}</th><th>${t('drop')}</th><th>${t('motorStart')}</th><th>${t('ikEnd')}</th><th>${t('thermal')}</th><th>${t('grading')}</th></tr></thead><tbody>${C.feederRows.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.I,1)} A</td><td>${x.cab?`${x.cab.runs}×${x.cab.size} mm²`:'—'}</td><td>${x.cab?x.cab.br:x.breaker} A / ${C.feedIcu} kA</td><td>${x.cab?fmt(x.cab.Iz,0)+' A':'—'}</td><td class="${x.cab&&x.cab.dUpct<=state.maxDrop?'status-good':'status-bad'}">${x.cab?fmt(x.cab.dUpct,2)+'%':'—'}</td><td class="${x.startDrop!=null&&x.startDrop>15?'status-warn':''}">${x.startDrop!=null?fmt(x.startDrop,1)+'%':'—'}</td><td>${x.cab?fmt(x.cab.Ik/1000,2)+' kA':'—'}</td><td>${x.cab?fmt(x.cab.Smin,1)+' mm²':'—'}</td><td class="${x.grading>=1.6?'status-good':'status-warn'}">${t(x.grading>=1.6?'selectivityGood':'selectivityWarn')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('noLoads')}</div>`}<div class="note" style="margin-top:12px"><strong>TCC:</strong> ${t('tccWarn')}</div></div>
 <div class="card"><h3>${t('formulaNotes')}</h3><div class="grid2"><div class="formula">${t('formulaDU')}</div><div class="formula">${t('formulaSC')}</div><div class="formula">${t('formulaThermal')}</div><div class="formula">${t('formulaP')}</div></div><div class="note"><strong>Isc:</strong> ${t('scWarn')}</div></div>`}
function renderGround(){C=calc();const earthOk=C.Rg<=state.ground.target;$('ground').innerHTML=pageHead('groundTitle','groundSub')+`<div class="grid2"><div class="card"><h3>${t('rodTitle')}</h3><div class="grid">${field('soil','gRho',state.ground.rho,'number','min="1"')}${field('rods','gRods',state.ground.rods,'number','min="1"')}${field('rodLen','gLen',state.ground.len,'number','min="0.5" step="0.1"')}${field('rodEfficiency','gEff',state.ground.eff,'number','min="0.1" max="1" step="0.05"')}${field('targetEarth','gTarget',state.ground.target,'number','min="0.1" step="0.1"')}</div><div class="divider"></div><div class="split"><span>${t('earthResult')}</span><b class="status-${earthOk?'good':'warn'}" style="font-size:24px">${fmt(C.Rg,2)} Ω</b></div><div class="hint">${t('spacingHint')}</div><div class="formula">${t('formulaEarth')}</div></div>
 <div class="card"><h3>${t('spdTitle')}</h3><div class="grid">${sel('externalLps','gLps',[['no',t('no')],['yes',t('yes')]],state.ground.lps)}${sel('serviceEntry','gEntry',[['cable',t('cableEntry')],['overhead',t('overhead')]],state.ground.entry)}</div><div class="divider"></div><div class="hint">${t('spdRec')}</div><div style="font-size:17px;font-weight:800;margin-top:6px">${C.spd}</div><div class="note" style="margin-top:12px"><strong>SPD:</strong> IEC 62305/60364 risk and coordination checks are still required.</div></div></div>`}
function renderEconomy(){C=calc();$('economy').innerHTML=pageHead('economyTitle','economySub')+`<div class="kpis">${kpi(t('energy'),fmt(C.energy,0)+' kWh/y','')}${kpi(t('energyCost'),fmt(C.cost,0)+' MDL/y','')}${kpi(t('lossBefore'),fmt(C.loss0,2)+' kW','')}${kpi(t('lossAfter'),fmt(C.loss,2)+' kW','')}${kpi(t('lossSaving'),fmt(C.lossSaving,0)+' MDL/y','')}${kpi(t('compPayback'),C.compPay?fmt(C.compPay,1)+' y':'—','')}</div>
 <div class="grid2"><div class="card"><h3>${t('compensation')}</h3><div class="grid">${field('capPrice','capPrice',state.econ.capPrice,'number','min="0"')}</div><div class="divider"></div><div class="split"><span>${t('capBank')}</span><b>${C.capStep} kvar</b></div><div class="split"><span>${t('compCost')}</span><b>${fmt(C.compCost,0)} MDL</b></div><div class="split"><span>${t('lossSaving')}</span><b>${fmt(C.lossSaving,0)} MDL/y</b></div><div class="note" style="margin-top:12px">${t('lossNote')}</div></div>
 <div class="card"><h3>${t('manualCapex')}</h3><div class="grid">${field('trafoCost','trafoCost',state.econ.trafoCost,'number','min="0"')}${field('cableCost','cableCost',state.econ.cableCost,'number','min="0"')}${field('switchCost','switchCost',state.econ.switchCost,'number','min="0"')}${field('installCost','installCost',state.econ.installCost,'number','min="0"')}</div><div class="divider"></div><div class="split"><span>${t('totalCapex')}</span><b style="font-size:22px">${fmt(C.totalCapex,0)} MDL</b></div></div></div>`}
function renderReport(){C=calc();$('report').innerHTML=pageHead('reportTitle','reportSub',`<button class="primary no-print" onclick="window.print()">🖨 ${t('printPdf')}</button>`)+`<article class="report" id="reportDoc"><div class="split"><div><h2>ElectroEngineer — ${esc(state.projectName)}</h2><div class="hint">Dorin Monolatii · F.E.I.E. U.T.M.</div></div><div class="code-pill">${new Date().toLocaleDateString(lang==='ro'?'ro-RO':lang==='en'?'en-GB':'ru-RU')}</div></div><p>${t('reportIntro')}</p><div class="report-section"><h3>${t('calcResults')}</h3><div class="kpis">${kpi('P',fmt(C.P,2)+' kW','')}${kpi('Q',fmt(C.Q,2)+' kvar','')}${kpi('S',fmt(C.S,2)+' kVA','')}${kpi('I',fmt(C.I,2)+' A','')}${kpi('Qc',fmt(C.Qc,2)+' kvar','')}${kpi('cosφ',fmt(C.pf,3),'')}</div></div><div class="report-section"><h3>${t('transformers')}</h3><p>${t('recommended')}: <b>${C.recommended} kVA</b>. ${t('loadPct')}: <b>${fmt(C.loadPct,1)}%</b>. ${t('n1')}: <b>${t(C.S1?(C.n1ok?'n1Ok':'n1Bad'):'noCat1')}</b>.</p></div><div class="report-section"><h3>${t('loadsCard')}</h3><table class="report-table"><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>P</th><th>Q</th><th>I</th><th>${t('cat')}</th></tr></thead><tbody>${C.loads.map(x=>`<tr><td>${esc(x.name)}</td><td>${t(x.type)}</td><td>${fmt(x.P,2)} kW</td><td>${fmt(x.Q,2)} kvar</td><td>${fmt(x.I,1)} A</td><td>${x.cat}</td></tr>`).join('')}</tbody></table></div><div class="report-section"><h3>${t('protectionTitle')}</h3><p>${t('busFault')}: <b>${fmt(C.IkBus/1000,2)} kA</b>. ${t('grshFault')}: <b>${fmt(C.grsh.Ik/1000,2)} kA</b>.</p><p>${t('mainCable')}: <b>${C.main?`${C.main.runs}×${C.main.size} mm² ${state.material}`:'—'}</b>; ${t('breaker')}: <b>${C.main?C.main.br:'—'} A / Icu ${C.mainIcu} kA</b>; ${t('drop')}: <b>${C.main?fmt(C.main.dUpct,2):'—'}%</b>.</p></div><div class="report-section"><h3>${t('earthResult')}</h3><p><b>${fmt(C.Rg,2)} Ω</b> / ${t('targetWord')} ${state.ground.target} Ω. SPD: ${C.spd}.</p></div><div class="report-section"><h3>${t('economyTitle')}</h3><p>${t('energy')}: <b>${fmt(C.energy,0)} kWh/y</b>; ${t('energyCost')}: <b>${fmt(C.cost,0)} MDL/y</b>; ${t('lossSaving')}: <b>${fmt(C.lossSaving,0)} MDL/y</b>.</p></div><div class="report-section"><h3>${t('singleLine')}</h3><div class="diagram" id="reportDiagram"></div></div><div class="note"><strong>!</strong> ${t('eduWarning')}</div></article>`;setTimeout(()=>renderDiagram('reportDiagram'),0)}
function renderDiagram(target='diagram'){const e=$(target);if(!e)return;C=calc();const tr=state.transformers.map(x=>`${esc(x.name)} ${x.kva} kVA · Uk ${x.uk}%`).join(' + ');const mc=C.main?`${C.main.runs}×${C.main.size} mm²`:'—';e.innerHTML=`<svg viewBox="0 0 1180 310"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--accent)"/></marker></defs><g fill="none" class="d-line" marker-end="url(#arr)"><path d="M140 130H235"/><path d="M390 130H480"/><path d="M640 130H735"/><path d="M900 130H995"/></g>${dbox(20,85,120,90,'MV',state.hv+' kV')}${dbox(235,80,155,100,'MV switchgear',fmt(C.IkBus/1000,1)+' kA LV equiv.')}${dbox(480,65,160,130,'Transformer',tr+' · Uk')}${dbox(735,75,165,110,'Main cable',mc+' · ΔU '+(C.main?fmt(C.main.dUpct,2):'—')+'%')}${dbox(995,75,160,110,'MDB',fmt(C.grsh.Ik/1000,1)+' kA')}<line x1="1075" y1="185" x2="1075" y2="255" class="d-bus"/>${dbox(280,235,150,65,'Cat. I',fmt(C.S1,1)+' kVA')}${dbox(515,235,150,65,'Motors',state.loads.filter(x=>x.type==='motor').length+' circuits')}${dbox(750,235,150,65,'Other loads',Math.max(0,state.loads.length-state.loads.filter(x=>x.type==='motor').length)+' circuits')}<path d="M1075 255H900" class="d-line" fill="none"/><path d="M1075 255H665" class="d-line" fill="none"/><path d="M1075 255H430" class="d-line" fill="none"/></svg>`}
function dbox(x,y,w,h,a,b){return `<rect class="d-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/><text class="d-title" x="${x+w/2}" y="${y+34}" text-anchor="middle">${a}</text><text class="d-sub" x="${x+w/2}" y="${y+58}" text-anchor="middle">${b}</text>`}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){nav();renderOverview();renderProject();renderLoads();renderProtection();renderGround();renderEconomy();if($('report').classList.contains('active'))renderReport();applyStaticI18n();}
function applyStaticI18n(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));$('lang').value=lang;document.documentElement.lang=lang}
function syncFromInputs(){const map=['projectName','hv','lv','ks','targetPf','sourceSk','mainLength','maxDrop','faultTime','material','insulation','derating','hours','price'];for(const id of map){const e=$(id);if(!e)continue;state[id]=['projectName','material','insulation'].includes(id)?e.value:val(e.value,state[id]);}const gm={gRho:'rho',gRods:'rods',gLen:'len',gEff:'eff',gTarget:'target',gLps:'lps',gEntry:'entry'};for(const [id,k] of Object.entries(gm)){const e=$(id);if(e)state.ground[k]=['lps','entry'].includes(k)?e.value:val(e.value,state.ground[k]);}const em={capPrice:'capPrice',trafoCost:'trafoCost',cableCost:'cableCost',switchCost:'switchCost',installCost:'installCost'};for(const [id,k] of Object.entries(em)){const e=$(id);if(e)state.econ[k]=val(e.value,state.econ[k]);}}
function refresh(){syncFromInputs();const active=document.querySelector('.page.active')?.id||'overview';render();go(active,false)}
function setTrafo(i,k,v){state.transformers[i][k]=k==='name'?v:val(v);refresh()}function addTrafo(){state.transformers.push({name:'T'+(state.transformers.length+1),kva:630,uk:6});refresh()}function delTrafo(i){if(state.transformers.length>1)state.transformers.splice(i,1);refresh()}
function setLoad(i,k,v){state.loads[i][k]=['name','type','cat'].includes(k)?v:val(v);refresh()}function addLoad(){state.loads.push({name:'Load '+(state.loads.length+1),type:'other',qty:1,kw:5,eta:1,pf:.9,ku:1,cat:'III',len:30,startK:1});refresh()}function delLoad(i){state.loads.splice(i,1);refresh()}function clearLoads(){if(confirm(t('confirmClear'))){state.loads=[];refresh()}}function demo(){state.loads=[{name:'Конвейер M1',type:'motor',qty:1,kw:15,eta:.91,pf:.84,ku:1,cat:'I',len:45,startK:6},{name:'Насосы',type:'motor',qty:2,kw:7.5,eta:.9,pf:.82,ku:.8,cat:'II',len:60,startK:6},{name:'Освещение',type:'lighting',qty:1,kw:12,eta:1,pf:.95,ku:.9,cat:'III',len:70,startK:1}];refresh()}
function saveProject(){syncFromInputs();localStorage.setItem('EE_STUDIO_V4',JSON.stringify(state));alert(t('saved'))}function loadProject(){const x=localStorage.getItem('EE_STUDIO_V4');if(!x)return alert(t('noSaved'));try{state=JSON.parse(x);refresh();alert(t('loaded'))}catch(e){alert(t('noSaved'))}}
Object.assign(window,{setTrafo,addTrafo,delTrafo,setLoad,addLoad,delLoad,clearLoads,demo,saveProject,loadProject});
document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;localStorage.setItem('EE_LANG',lang);render();return}if(e.target.closest('.page')&&!e.target.classList.contains('cell-input'))refresh()});
document.addEventListener('input',e=>{if(e.target.closest('.page')&&!e.target.classList.contains('cell-input')){clearTimeout(window.__eeTimer);window.__eeTimer=setTimeout(refresh,250)}});
$('themeBtn').onclick=()=>{const now=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=now;localStorage.setItem('EE_THEME',now)};document.documentElement.dataset.theme=localStorage.getItem('EE_THEME')||'dark';
render();
</script>
